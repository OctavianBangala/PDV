<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recepție - Pensiunea Pădurea Verde</title>
<style>
body{margin:0;font-family:Arial;background:#edf2ef}
header{background:#2e6b3b;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.room{border-radius:12px;padding:18px;text-align:center;color:#fff;font-weight:bold}
.free{background:#2e8b57}
.busy{background:#c0392b}
.nr{font-size:24px}
.st{margin-top:6px;font-size:14px}
#panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #ccc;padding:12px;display:none}
input,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}
button{background:#2e6b3b;color:#fff;border:none;border-radius:8px}
</style>
</head>
<body>
<header>Pensiunea Pădurea Verde</header>
<div class="grid">
<div class="room free" data-room="1A" onclick="openRoom('1A')"><div class="nr">1A</div><div class="st">Liberă</div></div>
<div class="room free" data-room="2A" onclick="openRoom('2A')"><div class="nr">2A</div><div class="st">Liberă</div></div>
<div class="room free" data-room="3A" onclick="openRoom('3A')"><div class="nr">3A</div><div class="st">Liberă</div></div>
<div class="room free" data-room="4A" onclick="openRoom('4A')"><div class="nr">4A</div><div class="st">Liberă</div></div>
<div class="room free" data-room="5A" onclick="openRoom('5A')"><div class="nr">5A</div><div class="st">Liberă</div></div>
<div class="room free" data-room="6A" onclick="openRoom('6A')"><div class="nr">6A</div><div class="st">Liberă</div></div>
<div class="room free" data-room="1B" onclick="openRoom('1B')"><div class="nr">1B</div><div class="st">Liberă</div></div>
<div class="room free" data-room="2B" onclick="openRoom('2B')"><div class="nr">2B</div><div class="st">Liberă</div></div>
<div class="room free" data-room="3B" onclick="openRoom('3B')"><div class="nr">3B</div><div class="st">Liberă</div></div>
<div class="room free" data-room="4B" onclick="openRoom('4B')"><div class="nr">4B</div><div class="st">Liberă</div></div>
<div class="room free" data-room="5B" onclick="openRoom('5B')"><div class="nr">5B</div><div class="st">Liberă</div></div>
<div class="room free" data-room="6B" onclick="openRoom('6B')"><div class="nr">6B</div><div class="st">Liberă</div></div>
<div class="room free" data-room="7B" onclick="openRoom('7B')"><div class="nr">7B</div><div class="st">Liberă</div></div>
<div class="room free" data-room="8B" onclick="openRoom('8B')"><div class="nr">8B</div><div class="st">Liberă</div></div>
<div class="room free" data-room="9B" onclick="openRoom('9B')"><div class="nr">9B</div><div class="st">Liberă</div></div>

</div>

<div id="panel">
<h3 id="title"></h3>
<input id="client" placeholder="Nume client">
<input id="phone" placeholder="Telefon">
<input id="in" type="date">
<input id="out" type="date">
<button onclick="save()">Salvează rezervarea</button>
<button onclick="release()">Eliberează camera</button>
</div>

<script>
let current="";
let db=JSON.parse(localStorage.getItem("pv_rooms")||"{}");

function refresh(){
 document.querySelectorAll(".room").forEach(c=>{
   let r=c.dataset.room;
   if(db[r]){c.className="room busy";c.querySelector(".st").innerText=db[r].client;}
   else{c.className="room free";c.querySelector(".st").innerText="Liberă";}
 });
 localStorage.setItem("pv_rooms",JSON.stringify(db));
}

function openRoom(r){
 current=r;
 panel.style.display="block";
 title.innerText="Camera "+r;
 if(db[r]){
   client.value=db[r].client;
   phone.value=db[r].phone;
   document.getElementById("in").value=db[r].cin;
   document.getElementById("out").value=db[r].cout;
 }else{
   client.value="";phone.value="";
   document.getElementById("in").value="";
   document.getElementById("out").value="";
 }
}

function save(){
 db[current]={client:client.value,phone:phone.value,cin:document.getElementById("in").value,cout:document.getElementById("out").value};
 refresh();
 alert("Rezervarea a fost salvată.");
}

function release(){
 delete db[current];
 refresh();
 alert("Camera a fost eliberată.");
}

refresh();
</script>
</body>
</html>
