<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pensiunea Pădurea Verde</title>

    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/utils.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/database.js"></script>
    <script defer src="js/dashboard.js"></script>
    <script defer src="js/calendar.js"></script>
    <script defer src="js/reservations.js"></script>
</head>

<body>

<header>

    <div class="logo">

        <h1>🏡 Pensiunea Pădurea Verde</h1>

    </div>

    <div class="user">

        Recepție

    </div>

</header>

<div class="container">

    <aside>

        <button id="btnDashboard">Dashboard</button>

        <button id="btnCalendar">Calendar</button>

        <button id="btnReservations">Rezervări</button>

        <button id="btnClients">Clienți</button>

        <button id="btnPayments">Încasări</button>

        <button id="btnSettings">Setări</button>

    </aside>

    <main>

        <section id="dashboard">

            <h2>Dashboard</h2>

            <div class="cards">

                <div class="card">
                    <h3>Camere Libere</h3>
                    <span id="freeRooms">0</span>
                </div>

                <div class="card">
                    <h3>Camere Ocupate</h3>
                    <span id="busyRooms">0</span>
                </div>

                <div class="card">
                    <h3>Check-In Azi</h3>
                    <span id="todayCheckIn">0</span>
                </div>

                <div class="card">
                    <h3>Check-Out Azi</h3>
                    <span id="todayCheckOut">0</span>
                </div>

            </div>

        </section>

        <section id="calendar">

            <h2>Calendar Rezervări</h2>

            <div id="calendarContainer">

            </div>

        </section>

        <section id="reservations">

            <h2>Rezervări</h2>

            <button id="newReservation">

                + Rezervare Nouă

            </button>

            <div id="reservationList">

            </div>

        </section>

    </main>

</div>

</body>

</html>
